[project]
name = "laboratory"
version = "0.1.0"
description = "Python virtual environments and dependencies management laboratory"
authors = [
    {name = "pauhenr2"}
]
requires-python = ">=3.13"
dependencies = [
    "pandas (>=3.1.1,<4.0.0)",
    "numpy (>=2.5.4,<3.0.0)"
]

[tool.poetry]
package-mode = false


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
